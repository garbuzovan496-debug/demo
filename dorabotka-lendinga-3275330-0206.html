function recalc(){
  var budget=0, lvl=null;
  document.querySelectorAll('#cUr .o.on').forEach(function(o){ budget+=Number(o.dataset.price||0); lvl=o; });
  var g=CALC_CFG.unitDefault; var cG=document.getElementById('cG'); if(cG) g=Number(cG.value)||CALC_CFG.unitDefault;
  var perU = lvl ? Number(lvl.dataset.perunit||0) : 0;
  budget += g*perU;
  document.querySelectorAll('#cDop .o.on').forEach(function(o){ budget+=Number(o.dataset.price||0); });
  var sB=document.getElementById('sB'); if(sB) sB.textContent=fmt(budget)+' ₽';
  var cGv=document.getElementById('cGv'); if(cGv) cGv.textContent=g+' '+CALC_CFG.unitName;
  var sL=document.getElementById('sL');
  if(sL && lvl){
    var lines=[['Базовый пакет: '+lvl.dataset.name, Number(lvl.dataset.price||0)], [g+' '+CALC_CFG.unitName+' × '+fmt(perU)+' ₽', g*perU]];
    document.querySelectorAll('#cDop .o.on').forEach(function(o){ lines.push([o.dataset.name, Number(o.dataset.price||0)]); });
    sL.innerHTML=lines.map(function(l){ return '<div class="ln"><span>'+l[0]+'</span><b>'+fmt(l[1])+' ₽</b></div>'; }).join('');
  }
  var fQ=document.getElementById('fQ'); if(fQ) fQ.placeholder='Опишите задачу ('+g+' '+CALC_CFG.unitName+', ориентир '+fmt(budget)+' ₽)';
}

var cUr=document.getElementById('cUr'); if(cUr) cUr.addEventListener('click',function(e){ var b=e.target.closest('.o'); if(!b)return; cUr.querySelectorAll('.o').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); recalc(); });
var cDop=document.getElementById('cDop'); if(cDop) cDop.addEventListener('click',function(e){ var b=e.target.closest('.o'); if(!b)return; b.classList.toggle('on'); recalc(); });

var answered={};
var qs=document.getElementById('qs'); if(qs){ qs.addEventListener('click',function(e){
  var b=e.target.closest('button[data-w]'); if(!b)return;
  var q=b.closest('.q'); if(!q)return;
  q.querySelectorAll('button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on');
  answered[q.dataset.q]=Number(b.dataset.w);
  var total=document.querySelectorAll('#qs .q').length;
  if(Object.keys(answered).length===total){
    var sum=0; for(var k in answered) sum+=answered[k];
    var max=total*2, verd=document.getElementById('verd');
    if(verd){ var t=sum>=max-1?verd.dataset.yes:sum>=max-3?verd.dataset.maybe:verd.dataset.no;
      verd.innerHTML='<b>'+esc(t)+'</b><p style="color:var(--mute);margin:8px 0 16px">Подробности обсудим на бесплатной консультации.</p><a class="btn d" href="#zayavka">Записаться на консультацию</a>'; verd.classList.add('on'); }
  }
}); }

async function sendLeadToTelegram(form){
  var inputs=form.querySelectorAll('input, textarea');
  var name=(inputs[0]&&inputs[0].value)?inputs[0].value.trim():'Клиент';
  var contact=(inputs[1]&&inputs[1].value)?inputs[1].value.trim():'Не указан';
  var date=(inputs[2]&&inputs[2].value)?inputs[2].value.trim():'';
  var vision=(inputs[3]&&inputs[3].value)?inputs[3].value.trim():'';
  var sB=document.getElementById('sB'), cGv=document.getElementById('cGv');
  var calcTxt = sB ? ('\n💰 Расчёт: '+sB.textContent+(cGv?(', '+cGv.textContent):'')) : '';
  var text='🔥 Новая заявка с сайта!\n👤 Имя: '+name+'\n📞 Контакт: '+contact+(date?'\n📅 '+date:'')+calcTxt+(vision?'\n💬 '+vision:'');
  if(CONFIG.TG_BOT_TOKEN && CONFIG.TG_CHAT_ID){
    try{ await fetch('https://api.telegram.org/bot'+CONFIG.TG_BOT_TOKEN+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:CONFIG.TG_CHAT_ID,text:text})}); }catch(e){ console.error(e); }
  }
  if(CONFIG.YM_COUNTER_ID && typeof ym==='function') ym(CONFIG.YM_COUNTER_ID,'reachGoal','lead_sent');
  var ok=document.getElementById('ok');
  if(ok){ ok.innerHTML='<b>Спасибо, '+esc(name)+'!</b><p style="color:var(--mute);margin:8px 0 0">Заявка принята и передана менеджеру в Telegram. Свяжемся в течение дня.</p>'; ok.classList.add('on'); form.style.display='none'; }
}
